# fly.toml app configuration file generated for lemdroid-alexandrite-ui on 2023-07-30T15:15:06-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Reproduces live state as of 2026-11-04 (snapshot of the Fly Machines API).
# Live: 2 machines, sjc, shared-cpu-1x / 256 MB (min 0, autostop). IPv6 only.
# Hostnames: a.lemdro.id; alexandrite.lemdro.id cert is "Awaiting configuration" (DNS not pointed).
# Previously ":latest"; pinned to the version live was running:
#   ghcr.io/sheodox/alexandrite 0.8.20 (rev 452a1805bae5cfefa0606eaa2abe0ffee23ef540)
#   digest sha256:e428c2b3f00e3a3ce8add5db5ec07aa35417e2fbb54a57cce5f887ab51820dbe

app = "lemdroid-alexandrite-ui"
primary_region = "sjc"

[build]
  image = "ghcr.io/sheodox/alexandrite@sha256:e428c2b3f00e3a3ce8add5db5ec07aa35417e2fbb54a57cce5f887ab51820dbe"

[deploy]
  strategy = "canary"

[env]
  ALEXANDRITE_DEFAULT_INSTANCE = "lemdro.id"
  ALEXANDRITE_FORCE_INSTANCE = "lemdro.id"
  ALEXANDRITE_WELCOME_INSTANCE_HELP = "false"
  ALEXANDRITE_WELCOME_LEMMY_HELP = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    hard_limit = 1024
    soft_limit = 512

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
