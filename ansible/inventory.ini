[lemdroid]
lemdroid-ovh ansible_host=lemdroid-ovh.alpaca-lizard.ts.net ansible_user=debian ansible_become=true ansible_ssh_private_key_file=~/.ssh/ovh_lemdroid

# CT 102 grafana-influx (Proxmox, home). Only for grafana.yml (role grafana_lemdroid). SSH for Ansible is not set up
# on CT 102 yet: needs Cole's OK (a key for this user), see ../docs/grafana-access.md.
# grafana_lemdroid_allowed_logins is set in group_vars/grafana_home/vars.yml (placeholder, empty). Cole's Grafana
# username is not in this repo. The list must be non-empty before obs_grafana_access_enabled is true in
# group_vars/lemdroid; the org-member check fails if any other login (except sa-*) is an org member.
[grafana_home]
grafana-influx ansible_host=grafana-influx.alpaca-lizard.ts.net ansible_user=root
