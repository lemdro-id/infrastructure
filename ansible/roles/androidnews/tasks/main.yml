# AndroidNews bot: posts RSS headlines to !android as AndroidNews@lemdro.id.
# v2 is live (every 15 minutes via /opt/android-news-bot/v2/run.sh).
# v1 files stay at /opt/android-news-bot/ for rollback
# (restore the v1 cron line: */30 * * * * androidnews /opt/android-news-bot/run.sh).
# state-v2.json (and v1's state.json) and poster.log are data: restore a state file
# from a backup if you have one; without it v2 still dedupes against recent !android posts.
# Only one copy may ever run (double posts): the cron job is installed only with lemdroid_start_services.

- name: androidnews group
  ansible.builtin.group:
    name: androidnews
    gid: 992
    system: true

- name: androidnews user
  ansible.builtin.user:
    name: androidnews
    uid: 999
    group: androidnews
    system: true
    home: /opt/android-news-bot
    create_home: true
    shell: /usr/sbin/nologin

- name: /opt/android-news-bot
  ansible.builtin.file:
    path: /opt/android-news-bot
    state: directory
    owner: androidnews
    group: androidnews
    mode: "0755"

- name: /opt/android-news-bot/v2
  ansible.builtin.file:
    path: /opt/android-news-bot/v2
    state: directory
    owner: androidnews
    group: androidnews
    mode: "0755"

- name: v1 bot code and config (kept for rollback; cron no longer points here)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/android-news-bot/{{ item }}"
    owner: androidnews
    group: androidnews
    mode: "0644"
  loop:
    - poster.py
    - config.yaml
    - README.md

- name: v1 runner (root-owned so the bot user cannot rewrite it)
  ansible.builtin.copy:
    src: run.sh
    dest: /opt/android-news-bot/run.sh
    owner: root
    group: root
    mode: "0755"

# Named files only. Do not copy the whole v2/ directory: test_poster.py is the
# unit suite and must not be installed under /opt/android-news-bot/v2.
- name: v2 bot code and config
  ansible.builtin.copy:
    src: "v2/{{ item }}"
    dest: "/opt/android-news-bot/v2/{{ item }}"
    owner: androidnews
    group: androidnews
    mode: "0644"
  loop:
    - poster.py
    - config.yaml
    - README.md

- name: v2 runner (root-owned so the bot user cannot rewrite it)
  ansible.builtin.copy:
    src: v2/run.sh
    dest: /opt/android-news-bot/v2/run.sh
    owner: root
    group: root
    mode: "0755"

- name: Bot password (secret)
  ansible.builtin.copy:
    dest: /opt/android-news-bot/.password
    content: "{{ vault_androidnews_password }}\n"
    owner: androidnews
    group: androidnews
    mode: "0600"
  no_log: true
  diff: false

- name: Cron job (every 15 min, v2)
  ansible.builtin.copy:
    src: android-news-bot.cron
    dest: /etc/cron.d/android-news-bot
    owner: root
    group: root
    mode: "0644"
  when: lemdroid_start_services | bool
