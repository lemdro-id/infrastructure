# Docker CE from download.docker.com (trixie). Default daemon config (no daemon.json).
# All containers use host networking on 127.0.0.1; the nftables forward chain is policy drop.

- name: /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt key (dearmored)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod 0644 /etc/apt/keyrings/docker.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg

- name: Docker apt key fingerprint check (read-only)
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.gpg
    checksum_algorithm: sha256
  register: docker_key

- name: Docker apt key is the expected one
  ansible.builtin.assert:
    that: docker_key.stat.checksum == 'a09e26b72228e330d55bf134b8eaca57365ef44bf70b8e27c5f55ea87a8b05e2'
    quiet: true
  when: docker_key.stat.exists

- name: Docker apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian trixie stable
  register: docker_repo

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Docker enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd.service
    - docker.socket
    - docker.service
