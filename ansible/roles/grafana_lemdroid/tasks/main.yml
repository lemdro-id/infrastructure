# Role grafana_lemdroid (CT 102 grafana-influx). Touches only: the VictoriaLogs plugin dir, two provisioning files,
# the lemdro.id dashboards dir, one systemd drop-in for grafana-server, and the lemdro.id folder's permissions.
# The only restart is grafana-server (handler), and only when the drop-in, datasources or plugin changed.
- name: Grafana version (read-only)
  ansible.builtin.command: grafana server -v
  register: grafana_lemdroid_ver
  changed_when: false
  check_mode: false

- name: Grafana is new enough and the Influx token is set
  ansible.builtin.assert:
    that:
      - (grafana_lemdroid_ver.stdout | regex_search('\d+\.\d+\.\d+')) is version(grafana_lemdroid_min_version, '>=')
      - grafana_lemdroid_influx_token | length > 0
    fail_msg: "Grafana < {{ grafana_lemdroid_min_version }} or vault_grafana_influx_read_token missing"
    quiet: true

- name: VictoriaLogs datasource plugin (pinned, signed)
  ansible.builtin.command: >-
    grafana cli --homepath /usr/share/grafana plugins install
    {{ grafana_lemdroid_vl_plugin }} {{ grafana_lemdroid_vl_plugin_version }}
  args:
    creates: "/var/lib/grafana/plugins/{{ grafana_lemdroid_vl_plugin }}/plugin.json"
  notify: Restart grafana-server

- name: VictoriaLogs plugin version matches the pin (read-only)
  ansible.builtin.slurp:
    src: "/var/lib/grafana/plugins/{{ grafana_lemdroid_vl_plugin }}/plugin.json"
  register: grafana_lemdroid_plugin_json
  when: not ansible_check_mode

- name: Plugin pin check
  ansible.builtin.assert:
    that:
      - (grafana_lemdroid_plugin_json.content | b64decode | from_json).info.version == grafana_lemdroid_vl_plugin_version
    fail_msg: >-
      {{ grafana_lemdroid_vl_plugin }} is not {{ grafana_lemdroid_vl_plugin_version }}; update it with
      `grafana cli plugins update {{ grafana_lemdroid_vl_plugin }}` or change the pin
    quiet: true
  when: not ansible_check_mode

- name: Drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ grafana_lemdroid_service }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: grafana-server hardening drop-in (anonymous off, no sign-up, no public dashboards or external snapshots)
  ansible.builtin.template:
    src: 10-lemdroid.conf.j2
    dest: "/etc/systemd/system/{{ grafana_lemdroid_service }}.service.d/10-lemdroid.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana-server

- name: Datasources (tokens from vault; root:grafana 0640; never logged)
  ansible.builtin.template:
    src: lemdroid-datasources.yaml.j2
    dest: "{{ grafana_lemdroid_provisioning_dir }}/datasources/lemdroid.yaml"
    owner: root
    group: grafana
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart grafana-server

- name: Dashboard provider
  ansible.builtin.template:
    src: lemdroid-dashboards.yaml.j2
    dest: "{{ grafana_lemdroid_provisioning_dir }}/dashboards/lemdroid.yaml"
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana-server

- name: Dashboards directory
  ansible.builtin.file:
    path: "{{ grafana_lemdroid_dashboards_dir }}"
    state: directory
    owner: root
    group: grafana
    mode: "0750"

# Picked up by the provider within updateIntervalSeconds; no restart.
- name: Dashboards (JSON, generated by ansible/scripts/gen-grafana-dashboards.py)
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "{{ grafana_lemdroid_dashboards_dir }}/{{ item }}"
    owner: root
    group: grafana
    mode: "0640"
  loop: >-
    {{ ['lemdroid-interactions.json']
       + (['lemdroid-health.json', 'lemdroid-logs.json', 'lemdroid-maps.json'] if grafana_lemdroid_gateway_enabled else []) }}

- name: Gateway dashboards absent while the gateway is off (no broken panels)
  ansible.builtin.file:
    path: "{{ grafana_lemdroid_dashboards_dir }}/{{ item }}"
    state: absent
  loop: [lemdroid-health.json, lemdroid-logs.json, lemdroid-maps.json]
  when: not grafana_lemdroid_gateway_enabled

- name: Apply restarts now (the API checks below need the new config)
  ansible.builtin.meta: flush_handlers

# ---- Cole-only: folder permissions + org membership (HTTP API on 127.0.0.1, admin service account from vault) ----
- name: Grafana API checks
  when: not ansible_check_mode and grafana_lemdroid_admin_token | length > 0
  block:
    - name: Wait for Grafana
      ansible.builtin.uri:
        url: "{{ grafana_lemdroid_api_url }}/api/health"
      register: grafana_lemdroid_health
      until: grafana_lemdroid_health.status == 200
      retries: 30
      delay: 2

    - name: Anonymous access is off (unauthenticated search must be 401)
      ansible.builtin.uri:
        url: "{{ grafana_lemdroid_api_url }}/api/search"
        status_code: 401

    - name: Org users (read-only)
      ansible.builtin.uri:
        url: "{{ grafana_lemdroid_api_url }}/api/org/users"
        headers: {Authorization: "Bearer {{ grafana_lemdroid_admin_token }}"}
      register: grafana_lemdroid_users
      no_log: true

    - name: Only the allowed logins are org members (OSS can't restrict datasources per user)
      ansible.builtin.assert:
        that: grafana_lemdroid_extra_users | length == 0
        fail_msg: "Grafana org has users beyond grafana_lemdroid_allowed_logins: {{ grafana_lemdroid_extra_users }}"
        quiet: true
      vars:
        grafana_lemdroid_extra_users: >-
          {{ grafana_lemdroid_users.json | map(attribute='login') | reject('in', grafana_lemdroid_allowed_logins)
             | reject('match', '^sa-') | list }}
      when: grafana_lemdroid_allowed_logins | length > 0

    - name: Org member count (no allowlist configured)
      ansible.builtin.debug:
        msg: "{{ grafana_lemdroid_users.json | length }} org users; set grafana_lemdroid_allowed_logins to enforce"
      when: grafana_lemdroid_allowed_logins | length == 0

    - name: lemdro.id folder visible to Admins only (removes the default Viewer/Editor grants)
      ansible.builtin.uri:
        url: "{{ grafana_lemdroid_api_url }}/api/folders/{{ grafana_lemdroid_folder_uid }}/permissions"
        method: POST
        headers: {Authorization: "Bearer {{ grafana_lemdroid_admin_token }}"}
        body_format: json
        body: {items: [{role: Admin, permission: 4}]}
      register: grafana_lemdroid_perm
      until: grafana_lemdroid_perm.status == 200
      retries: 10
      delay: 6
      changed_when: false
