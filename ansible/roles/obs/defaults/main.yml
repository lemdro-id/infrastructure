# lemdro.id observability stack on lemdroid-ovh (plan: lemdroid-observability-20261123 rev 4, P1).
# present = install/configure/start; absent = full teardown (tasks/absent.yml). Nothing here touches Lemmy,
# pict-rs, Postgres config or the frontends containers.
obs_state: present

obs_user: obs
obs_root: /opt/obs
obs_etc: /etc/obs
obs_data: /var/lib/obs

# Every obs listener, in one map, so a clash fails the play (PLAN §11a; the old 9101 node-slow vs pict-rs clash).
# All bind 127.0.0.1. Reserved = owned by other services (P2), listed only so nothing here can take them.
obs_bind: 127.0.0.1
obs_ports:
  victoriametrics: 8428
  victorialogs: 9428
  vl_ip: 9429
  node_fast: 9100
  node_slow: 9101
  process_exporter: 9256
  postgres_exporter: 9187
  sql_exporter: 9399
  reserved_pictrs_metrics: 9102     # P2: PICTRS__METRICS__PROMETHEUS_ADDRESS=127.0.0.1:9102
  reserved_lemmy_metrics: 10002     # P2: config.hjson prometheus { bind: 127.0.0.1, port: 10002 }
  reserved_nginx_stub_status: 8090  # frontends: stub_status, 127.0.0.1 only
  reserved_vmalert: 8880
  reserved_alertmanager: 9093
  reserved_vmauth_internal: 8426    # P2: vmauth /metrics,/flags on loopback; only when obs_grafana_access_enabled

# Retention (PLAN §10). Raw OVH data is not backed up (30-day working set).
obs_vm_retention: 30d
obs_vm_min_free_disk: 20GiB
obs_vm_memory_allowed: 256MB
obs_vl_retention: 30d
obs_vl_max_disk: 15GiB
obs_vl_ip_retention: 14d            # full client IPs: 14 days, nowhere else
obs_vl_ip_max_disk: 1GiB

# Pinned upstream releases, verified against each project's published SHA-256 list (2026-11-23).
obs_binaries:
  - name: victoria-metrics
    version: v1.157.0
    url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.157.0/victoria-metrics-linux-amd64-v1.157.0.tar.gz
    sha256: 7b31192da6cf805b8b9244a904b022948e8022a067a822c30cb9f94600d0c387
    path: victoria-metrics-prod
    units: [obs-victoriametrics]
  - name: victoria-logs
    version: v1.54.0
    url: https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/v1.54.0/victoria-logs-linux-amd64-v1.54.0.tar.gz
    sha256: 739e78c82294520b6079bc8a6ae32a1f9fb95a543092929a53a2fe9ab7383016
    path: victoria-logs-prod
    units: [obs-victorialogs, obs-vl-ip]
  - name: node_exporter
    version: 1.13.1
    url: https://github.com/prometheus/node_exporter/releases/download/v1.13.1/node_exporter-1.13.1.linux-amd64.tar.gz
    sha256: 5c00c5234f1ee45900b25539a5a0ab82146a098c15c16a4ec3bc855b597a6477
    path: node_exporter-1.13.1.linux-amd64/node_exporter
    units: [obs-node-fast, obs-node-slow]
  - name: vector
    version: 0.62.0
    url: https://github.com/vectordotdev/vector/releases/download/v0.62.0/vector-0.62.0-x86_64-unknown-linux-gnu.tar.gz
    sha256: e9d9cb3ee12288544c813453d0548524ab2bcc8f7e81b601f5e9d378fa6ac2f6
    path: vector-x86_64-unknown-linux-gnu/bin/vector
    units: [obs-vector]
  - name: process-exporter
    version: 0.8.7
    url: https://github.com/ncabatoff/process-exporter/releases/download/v0.8.7/process-exporter-0.8.7.linux-amd64.tar.gz
    sha256: 6d274cca5e94c6a25e55ec05762a472561859ce0a05b984aaedb67dd857ceee2
    path: process-exporter-0.8.7.linux-amd64/process-exporter
    units: [obs-process-exporter]
  - name: postgres_exporter
    version: 0.21.1
    url: https://github.com/prometheus-community/postgres_exporter/releases/download/v0.21.1/postgres_exporter-0.21.1.linux-amd64.tar.gz
    sha256: 02f316da4e9e409749d6f3b25102d3561cb408023110f3653f6514548926ff0c
    path: postgres_exporter-0.21.1.linux-amd64/postgres_exporter
    units: [obs-postgres-exporter]
  # P2: vmauth (read-only Grafana gateway). Unpacked always; obs-vmauth exists only when obs_grafana_access_enabled.
  - name: vmutils
    version: v1.157.0
    url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.157.0/vmutils-linux-amd64-v1.157.0.tar.gz
    sha256: f797ecaa5045a8f8095a813a3b3e2ef697e4086affcc174547cf559768044862
    path: vmauth-prod
    units: "{{ ['obs-vmauth'] if obs_grafana_access_enabled else [] }}"
  - name: sql_exporter
    version: 0.24.14
    url: https://github.com/burningalchemist/sql_exporter/releases/download/0.24.14/sql_exporter-0.24.14.linux-amd64.tar.gz
    sha256: e6b7b08f48ccd4a30256e163c620810bf06c6d75d1aa21d83417b260ea3fac76
    path: sql_exporter-0.24.14.linux-amd64/sql_exporter
    units: [obs-sql-exporter]

# Log files Vector reads; read access is a per-user ACL for obs (never group adm). Teardown removes the ACLs.
obs_log_acls:
  - {dir: /var/log/postgresql, files: [/var/log/postgresql/postgresql-16-main.log]}
  - {dir: /var/log/lemdroid-nginx, files: [/var/log/lemdroid-nginx/access.json, /var/log/lemdroid-nginx/access.json.1]}

# systemd units. All run as obs in obs.slice. Slice MemoryHigh/MemoryMax is 1344M/1600M with GeoIP off
# and 1664M/1920M with GeoIP on (templates/obs.slice.j2): the sum of these per-unit MemoryMax values,
# including obs-vmauth 64M when the gateway is on, stays under MemoryHigh. rw = extra writable paths
# (ProtectSystem=strict everywhere).
obs_units:
  - name: obs-victoriametrics
    bin: victoria-metrics
    memory_max: 384M
    rw: ["{{ obs_data }}/vm"]
    reload_hup: true      # SIGHUP re-reads -promscrape.config
    args:
      - "-httpListenAddr={{ obs_bind }}:{{ obs_ports.victoriametrics }}"
      - "-storageDataPath={{ obs_data }}/vm"
      - "-retentionPeriod={{ obs_vm_retention }}"
      - "-storage.minFreeDiskSpaceBytes={{ obs_vm_min_free_disk }}"
      - "-memory.allowedBytes={{ obs_vm_memory_allowed }}"
      - "-promscrape.config={{ obs_etc }}/scrape.yml"
      - "-promscrape.config.strictParse=true"
      - "-selfScrapeInterval=15s"
      - "-loggerTimezone=UTC"
  - name: obs-victorialogs
    bin: victoria-logs
    memory_max: 256M
    binds_to: [obs-nft-guard.service]   # PR-C: VL never runs without the uid-obs access guard
    rw: ["{{ obs_data }}/vl"]
    args:
      - "-httpListenAddr={{ obs_bind }}:{{ obs_ports.victorialogs }}"
      - "-storageDataPath={{ obs_data }}/vl"
      - "-retentionPeriod={{ obs_vl_retention }}"
      - "-retention.maxDiskSpaceUsageBytes={{ obs_vl_max_disk }}"
      - "-loggerTimezone=UTC"
  - name: obs-vl-ip
    bin: victoria-logs
    memory_max: 96M
    binds_to: [obs-nft-guard.service]   # PR-C: VL never runs without the uid-obs access guard
    rw: ["{{ obs_data }}/vl-ip"]
    args:
      - "-httpListenAddr={{ obs_bind }}:{{ obs_ports.vl_ip }}"
      - "-storageDataPath={{ obs_data }}/vl-ip"
      - "-retentionPeriod={{ obs_vl_ip_retention }}"
      - "-retention.maxDiskSpaceUsageBytes={{ obs_vl_ip_max_disk }}"
      - "-loggerTimezone=UTC"
  - name: obs-node-fast
    bin: node_exporter
    memory_max: 32M
    rw: []
    args:
      - "--web.listen-address={{ obs_bind }}:{{ obs_ports.node_fast }}"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.pressure"
      - "--collector.meminfo"
      - "--collector.vmstat"
      - "--collector.netdev"
      - "--collector.netstat"
      - "--collector.sockstat"
      - "--collector.conntrack"
      - "--collector.diskstats"
      - "--collector.loadavg"
      - "--collector.schedstat"
      - "--collector.softnet"
  - name: obs-node-slow
    bin: node_exporter
    memory_max: 32M
    rw: []
    args:
      - "--web.listen-address={{ obs_bind }}:{{ obs_ports.node_slow }}"
      - "--collector.disable-defaults"
      - "--collector.filesystem"
      - "--collector.mdadm"
      - "--collector.hwmon"
      - "--collector.nvme"
      - "--collector.systemd"
      - "--collector.timex"
      - "--collector.uname"
      - "--collector.textfile"
      - "--collector.textfile.directory={{ obs_data }}/textfile"
  - name: obs-vector
    bin: vector
    # GeoIP off: 256M (live cgroup was ~185M of a 192M cap). GeoIP on: the City DB is ~125 MB in the heap
    # and a reload briefly holds two copies, so 512M.
    memory_max: "{{ '512M' if obs_geoip_enabled else '256M' }}"
    supplementary_groups: [systemd-journal]   # read the journal; NOT adm, NOT docker
    rw: ["{{ obs_data }}/vector"]
    env: ["VECTOR_LOG=warn"]
    reload_hup: true      # P2: SIGHUP re-reads the config and the GeoIP table (obs-geoip-refresh)
    args:
      - "--config {{ obs_etc }}/vector/vector.toml"
      - "--config {{ obs_etc }}/vector/nginx-out.toml"
      - "--require-healthy false"
  - name: obs-process-exporter
    bin: process-exporter
    memory_max: 48M
    rw: []
    args:
      - "-web.listen-address={{ obs_bind }}:{{ obs_ports.process_exporter }}"
      - "-config.path={{ obs_etc }}/process-exporter.yml"
      - "-threads=false"
  # Postgres as role obs (peer auth over the unix socket, no password; role is read-only with statement_timeout 5s,
  # created by the postgres role's obs-role.sql, tag obs_pg — apply that first). pg_stat_statements stays off (P2).
  - name: obs-postgres-exporter
    bin: postgres_exporter
    memory_max: 64M
    rw: []
    env:
      - '"DATA_SOURCE_NAME=host=/var/run/postgresql user={{ obs_user }} dbname=lemmy sslmode=disable application_name=obs-pgexp"'
    args:
      - "--web.listen-address={{ obs_bind }}:{{ obs_ports.postgres_exporter }}"
      - "--config.file={{ obs_etc }}/postgres_exporter.yml"
      - "--no-collector.stat_statements"
      - "--collector.long_running_transactions"
      - "--collector.database_wraparound"
      - "--collector.stat_activity_autovacuum"
      - "--collector.stat_progress_vacuum"
      - "--collector.statio_user_indexes"
      - "--collector.postmaster"
      - "--log.level=warn"
  - name: obs-sql-exporter
    bin: sql_exporter
    memory_max: 64M
    rw: []
    args:
      - "-web.listen-address={{ obs_bind }}:{{ obs_ports.sql_exporter }}"
      - "-config.file={{ obs_etc }}/sql_exporter.yml"
      - "-log.level=warn"

# Interactions rollup (headline metric): hourly oneshot (systemd timer, UTC) -> Influx on CT 102, bucket
# lemdroid_interactions (created in APPLY). Empty token = query-only mode (nothing written anywhere but the job's
# own health metrics in the textfile dir). Top-N bounds: see obs_api.interactions() in the postgres role.
obs_interactions_influx_url: "http://{{ telegraf_influx_host | default('grafana-influx.alpaca-lizard.ts.net') }}:8086"
obs_interactions_influx_org: home
obs_interactions_influx_bucket: lemdroid_interactions
obs_interactions_influx_token: "{{ vault_obs_influx_interactions_token | default('') }}"
obs_interactions_top_home: 25
obs_interactions_top_site_home: 50
obs_interactions_top_remote: 200
obs_timers: [obs-interactions.timer, obs-geoip-refresh.timer]
obs_timer_files: [obs-interactions.service, obs-interactions.timer, obs-geoip-refresh.service, obs-geoip-refresh.timer]

# ---------------------------------------------------------------------------------------------------------------
# P2: Grafana (CT 102) read access. OFF until Cole OKs the tailnet ACL (docs/grafana-access.md). When on:
#   obs-vmauth listens on the Tailscale IP only (tailscale_ip:8427), runs as uid obs (so the VictoriaLogs uid guard
#   still holds), proxies a fixed read-only path allowlist to VM 127.0.0.1:8428 and VL 127.0.0.1:9428 (never vl-ip
#   9429), one bearer token per datasource (vault). nft (table inet obs_guard) drops :8427 from every source except
#   CT 102's tailnet IP. VictoriaMetrics and VictoriaLogs themselves stay on 127.0.0.1.
obs_grafana_access_enabled: false
obs_grafana_listen_ip: "{{ tailscale_ip }}"
obs_grafana_port: 8427
obs_grafana_peer_ip: "{{ telegraf_influx_ip }}"     # CT 102 grafana-influx (tailnet)
obs_grafana_vm_token: "{{ vault_obs_grafana_vm_token | default('') }}"
obs_grafana_vl_token: "{{ vault_obs_grafana_vl_token | default('') }}"
obs_units_extra: "{{ [obs_vmauth_unit] if obs_grafana_access_enabled else [] }}"
obs_vmauth_unit:
  name: obs-vmauth
  bin: vmauth
  memory_max: 64M
  after: [tailscaled.service]         # the listen address is the Tailscale IP
  wants: [tailscaled.service]
  binds_to: [obs-nft-guard.service]   # never listens without the CT-102-only source pin
  rw: []
  args:
    - "-httpListenAddr={{ obs_grafana_listen_ip }}:{{ obs_grafana_port }}"
    - "-httpInternalListenAddr={{ obs_bind }}:{{ obs_ports.reserved_vmauth_internal }}"
    - "-auth.config={{ obs_etc }}/vmauth.yml"
    - "-maxConcurrentRequests=16"
    - "-maxConcurrentPerUserRequests=8"
    - "-loggerTimezone=UTC"
    - "-loggerLevel=WARN"

# P2: GeoIP for the visitor and federation maps. OFF until merged + applied. Offline DB-IP "IP to City Lite"
# (CC BY 4.0, attribution "IP Geolocation by DB-IP", https://db-ip.com), refreshed by obs-geoip-refresh.timer.
# Lookups use the network address of the already-truncated client_net (/24, /48) only, inside Vector; nothing is
# looked up over the network. Stored: geo_country, geo_region, geo_city, geo_lat/geo_lon (DB city centroid, 0.1 deg).
obs_geoip_enabled: false
obs_geoip_dir: "{{ obs_data }}/geoip"
obs_geoip_db: "{{ obs_geoip_dir }}/dbip-city-lite.mmdb"
obs_geoip_url_template: "https://download.db-ip.com/free/dbip-city-lite-{month}.mmdb.gz"
# Cloudflare ranges (vendored from https://www.cloudflare.com/ips-v4 and /ips-v6, 2026-11-24). Networks inside them
# get geo_cdn=cloudflare (a federation peer egressing via Cloudflare is grouped as "CDN", not placed on the map).
# When GeoIP is on, obs-geoip-refresh GETs those two URLs weekly (the second outbound fetch, after the DB-IP
# download; no visitor data) and sets obs_geoip_cf_ranges_drift=1 on a change. The fix is a PR to this list
# (the VRL is rendered from it).
obs_cloudflare_ips:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
