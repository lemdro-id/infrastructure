[[tests]]
name = "pg: unknown zone flagged, never guessed"
[[tests.inputs]]
insert_at = "pg_parse"
type = "log"
log_fields.message = "2026-11-23 04:54:12.154 XYZ [77] LOG:  checkpoint complete"
[[tests.outputs]]
extract_from = "pg_parse"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.ts_parse_error, true)
'''

# ---------- journald ----------
[[tests]]
name = "journald: IPs truncated, metadata dropped"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
log_fields.message = "ERR Request failed error=\"x\" connIndex=1 ip=198.41.200.13 client=2001:db8:aa:bb:cc::1"
log_fields._SYSTEMD_UNIT = "cloudflared-lemdroid.service"
log_fields.PRIORITY = "3"
log_fields._CMDLINE = "/usr/bin/cloudflared tunnel run --token SHOULD_NOT_SHIP"
[[tests.outputs]]
extract_from = "journal_shape"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
j = encode_json(.)
assert!(!contains(j, "198.41.200.13"))
assert!(contains(j, "198.41.200.0"))
assert!(!contains(j, "SHOULD_NOT_SHIP"))
assert!(!contains(j, "aa:bb:cc::1"))
assert_eq!(.unit, "cloudflared-lemdroid.service")
assert_eq!(.priority, 3)
'''
