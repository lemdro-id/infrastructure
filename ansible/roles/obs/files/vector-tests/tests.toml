[[tests.outputs.conditions]]
type = "vrl"
source = '''
r = string!(.route)
assert!(includes(["/api/v3/user/password_change", "/api/v3/:other", "/.well-known/:other", "/.well-known/webfinger"], r))
assert!(!contains(r, "123456"))
assert!(!contains(r, "random"))
assert!(!contains(encode_json(.), "alice"))
'''

[[tests]]
name = "pg: 'value \"...\" is out of range' literal and Bearer token scrubbed"
[[tests.inputs]]
insert_at = "pg_parse"
type = "log"
log_fields.message = "2026-11-23 04:54:16.000 EST [1353] lemmy@lemmy ERROR:  value \"98765432109876\" is out of range for type integer at character 42 Authorization: Bearer abcDEF123456.tokXYZ"
[[tests.outputs]]
extract_from = "pg_parse"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
j = encode_json(.)
assert!(!contains(j, "98765432109876"))
assert!(!contains(j, "abcDEF123456"))
assert!(contains(j, "is out of range for type integer"))
'''

[[tests]]
name = "journald: Bearer token and double-slash paths"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
log_fields.message = "ERR request failed url=https://lemdro.id//feeds//all/eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOjN9.c2lnX3gz.xml header=\"Authorization: Bearer JRNLBEARER12345\" b=//pictrs//image/delete/JRNLDELTOK/x.png"
log_fields._SYSTEMD_UNIT = "cloudflared-lemdroid.service"
log_fields.PRIORITY = "3"
[[tests.outputs]]
extract_from = "journal_shape"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
j = encode_json(.)
assert!(!contains(j, "eyJ"))
assert!(!contains(j, "c2lnX3gz"))
assert!(!contains(j, "JRNLBEARER12345"))
assert!(!contains(j, "JRNLDELTOK"))
assert!(contains(j, "https://lemdro.id/feeds/all/:arg"))
'''
