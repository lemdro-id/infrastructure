- name: acl (file ACLs for the log readers)
  ansible.builtin.apt:
    name: acl
    state: present
  register: obs_acl_pkg

- name: obs system user (no shell, no home login)
  ansible.builtin.user:
    name: "{{ obs_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ obs_data }}"
    create_home: false
    groups: []
    append: false
  register: obs_user_task

- name: obs directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(obs_user) }}"
    group: "{{ item.group | default(obs_user) }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - {path: "{{ obs_root }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ obs_root }}/bin", owner: root, group: root, mode: "0755"}
    - {path: "{{ obs_root }}/dl", owner: root, group: root, mode: "0755"}
    - {path: "{{ obs_etc }}", owner: root, mode: "0750"}
    - {path: "{{ obs_data }}"}
    - {path: "{{ obs_data }}/vm"}
    - {path: "{{ obs_data }}/vl"}
    - {path: "{{ obs_data }}/vl-ip", mode: "0700"}
    - {path: "{{ obs_data }}/textfile", mode: "0755"}
    - {path: "{{ obs_data }}/vector", mode: "0700"}
    - {path: "{{ obs_etc }}/vector", owner: root, mode: "0750"}
  loop_control: {label: "{{ item.path }}"}
  register: obs_dirs

- name: obs.slice (memory/CPU/IO cap for the whole stack)
  ansible.builtin.template:
    src: obs.slice.j2
    dest: /etc/systemd/system/obs.slice
    owner: root
    group: root
    mode: "0644"
  register: obs_slice

# ---- pinned binaries (SHA-256 checked; no apt repos) ----
- name: Download release archives (checksum-verified)
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ obs_root }}/dl/{{ item.url | basename }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ obs_binaries }}"
  loop_control: {label: "{{ item.name }} {{ item.version }}"}
  register: obs_dl
  # --check on a fresh host: /opt/obs/dl doesn't exist yet, so there is nowhere to download to.
  when: not (ansible_check_mode and obs_dirs is changed)

- name: Version directories
  ansible.builtin.file:
    path: "{{ obs_root }}/{{ item.name }}-{{ item.version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ obs_binaries }}"
  loop_control: {label: "{{ item.name }} {{ item.version }}"}
  when: not (ansible_check_mode and obs_dirs is changed)

- name: Unpack
  ansible.builtin.unarchive:
    src: "{{ obs_root }}/dl/{{ item.url | basename }}"
    dest: "{{ obs_root }}/{{ item.name }}-{{ item.version }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ obs_root }}/{{ item.name }}-{{ item.version }}/{{ item.path }}"
  loop: "{{ obs_binaries }}"
  loop_control: {label: "{{ item.name }} {{ item.version }}"}
  # In --check the archive may not exist yet; nothing to unpack then.
  when: not ansible_check_mode

- name: Stable binary paths
  ansible.builtin.file:
    src: "{{ obs_root }}/{{ item.name }}-{{ item.version }}/{{ item.path }}"
    dest: "{{ obs_root }}/bin/{{ item.name }}"
    state: link
    force: "{{ ansible_check_mode }}"
    owner: root
    group: root
  loop: "{{ obs_binaries }}"
  loop_control: {label: "{{ item.name }}"}
  register: obs_links

# ---- config ----
- name: process-exporter groups
  ansible.builtin.copy:
    src: process-exporter.yml
    dest: "{{ obs_etc }}/process-exporter.yml"
    owner: root
    group: "{{ obs_user }}"
    mode: "0640"
  register: obs_cfg_process

- name: VictoriaMetrics scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ obs_etc }}/scrape.yml"
    owner: root
    group: "{{ obs_user }}"
    mode: "0640"
  register: obs_cfg_scrape

- name: GeoIP DB and refresh timer (P2; seeds the DB before Vector is pointed at it)
  ansible.builtin.include_tasks: geoip.yml

- name: Vector config, VRL and tests (tested before any restart)
  ansible.builtin.include_tasks: vector.yml

- name: VictoriaLogs access guard (nft, uid obs only)
  ansible.builtin.include_tasks: nft_guard.yml

- name: Postgres collectors and interactions rollup (configs)
  ansible.builtin.include_tasks: pg.yml

- name: Grafana read gateway config (P2; off unless obs_grafana_access_enabled)
  ansible.builtin.include_tasks: grafana_access.yml

- name: obs units
  ansible.builtin.template:
    src: obs-unit.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ obs_units + (obs_units_extra | default([])) }}"
  loop_control: {label: "{{ item.name }}"}
  register: obs_unit_files

- name: Which units need a restart (own units only)
  ansible.builtin.set_fact:
    obs_restart: >-
      {{ (obs_unit_files.results | selectattr('changed') | map(attribute='item.name') | list)
         + (obs_links.results | selectattr('changed') | map(attribute='item.units') | flatten)
         + (['obs-process-exporter'] if obs_cfg_process is changed else [])
         + (['obs-vector'] if obs_cfg_vector is changed else [])
         + (obs_restart_extra | default([])) }}

- name: systemd daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    obs_slice is changed or obs_unit_files is changed or obs_interactions_units is changed
    or (obs_vmauth_removed | default({})) is changed

- name: obs units enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: true
    state: started
  loop: "{{ obs_units + (obs_units_extra | default([])) }}"
  loop_control: {label: "{{ item.name }}"}
  register: obs_started
  # --check: a unit file that doesn't exist yet can't be queried; the real run starts it.
  when: not (ansible_check_mode and obs_unit_files is changed)

- name: Restart obs units whose binary, unit or config changed (obs units only)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ obs_restart | unique }}"
  # a unit that was just started for the first time needs no restart
  when:
    - not ansible_check_mode or obs_unit_files is not changed
    - item not in (obs_started.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | map(attribute='item.name') | list)

- name: Reload VictoriaMetrics scrape config (SIGHUP, no restart)
  ansible.builtin.systemd_service:
    name: obs-victoriametrics
    state: reloaded
  when:
    - obs_cfg_scrape is changed
    - "'obs-victoriametrics' not in obs_restart"
    - "'obs-victoriametrics' not in (obs_started.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | map(attribute='item.name') | list)"
    - not (ansible_check_mode and obs_unit_files is changed)

- name: GeoIP off -> remove its timer, DB and geo.vrl (after Vector runs the plain config)
  ansible.builtin.include_tasks: geoip_off.yml

- name: Interactions timer enabled (hourly at :07 UTC; the service itself is a oneshot)
  ansible.builtin.systemd_service:
    name: obs-interactions.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and obs_interactions_units is changed)

- name: Extra obs pieces (later P1 PRs)
  ansible.builtin.include_tasks: "{{ item }}"
  loop: "{{ obs_extra_tasks | default([]) }}"

# ---- listener gate (PLAN §11a, C6f): nothing obs-owned may listen beyond 127.0.0.1 ----
# Fail-closed: if the gate fails, every obs-* unit and timer is stopped AND disabled (so a reboot doesn't bring a bad
# listener back; nothing else is touched) and the play fails. The next good run re-enables them.
- name: Listener gate
  block:
    # ss, not a TCP connect: some ports only accept uid obs (nft guard), and nothing here should open a session.
    - name: obs ports are listening on 127.0.0.1 (waits up to 60 s for fresh starts; real run only)
      ansible.builtin.command: ss -Hltn "sport = :{{ item }}"
      register: obs_port_up
      until: obs_port_up.stdout is search('127\.0\.0\.1:' ~ item ~ '\s')
      retries: 30
      delay: 2
      changed_when: false
      loop: "{{ obs_ports | dict2items | rejectattr('key', 'match', 'reserved_') | map(attribute='value') | list }}"
      when: not ansible_check_mode

    - name: Grafana gateway listens on the Tailscale IP only (P2; real run only)
      ansible.builtin.command: ss -Hltn "sport = :{{ obs_grafana_port }}"
      register: obs_gw_up
      until: obs_gw_up.stdout is search(obs_grafana_listen_ip | regex_escape ~ ':' ~ obs_grafana_port ~ '\\s')
      retries: 30
      delay: 2
      changed_when: false
      when: not ansible_check_mode and obs_grafana_access_enabled

    - name: Listening sockets (read-only)
      ansible.builtin.command: ss -Hlntup
      register: obs_ss
      changed_when: false
      check_mode: false

    - name: No obs listener outside 127.0.0.1, and no obs process on 0.0.0.0 / [::] / *
      ansible.builtin.assert:
        that:
          - obs_bad_listeners | length == 0
        fail_msg: "obs listener not on 127.0.0.1: {{ obs_bad_listeners }}"
        quiet: true
      vars:
        obs_proc_re: '"(victoria-metric|victoria-logs|node_exporter|process-exporte|vector|postgres_export|sql_exporter|vmauth)"'
        obs_port_re: '^\S+\s+\S+\s+\d+\s+\d+\s+(?!127\.0\.0\.1:)\S+:({{ obs_ports.values() | reject("in", [8090, 9102, 10002]) | join("|") }})\s'
        # P2: the one allowed exception is obs-vmauth on <tailscale_ip>:<obs_grafana_port> (when enabled); any
        # other socket on that port, or vmauth anywhere else but loopback, is a failure.
        obs_gw_ok_re: '\s{{ obs_grafana_listen_ip | regex_escape }}:{{ obs_grafana_port }}\s.*"vmauth"'
        obs_gw_port_re: '^\S+\s+\S+\s+\d+\s+\d+\s+\S+:{{ obs_grafana_port }}\s'
        obs_bad_listeners: >-
          {{ (obs_ss.stdout_lines | select('search', obs_proc_re) | reject('search', '\s127\.0\.0\.1:\d+\s')
                | reject('search', obs_gw_ok_re if obs_grafana_access_enabled else '^$NEVER') | list)
             + (obs_ss.stdout_lines | select('search', obs_port_re) | list)
             + (obs_ss.stdout_lines | select('search', obs_gw_port_re)
                | reject('search', obs_gw_ok_re if obs_grafana_access_enabled else '^$NEVER') | list) }}
  rescue:
    - name: Gate failed -> stop and disable every obs unit and timer (obs-* only)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: >-
        {{ (obs_units + (obs_units_extra | default([]))) | map(attribute='name') | list + (obs_timers | default([])) }}
      failed_when: false
      when: not ansible_check_mode

    - name: Fail the play (obs stopped; see the listener list above)
      ansible.builtin.fail:
        msg: >-
          Listener gate failed on {{ ansible_failed_task.name | default('?') }}:
          {{ ansible_failed_result.msg | default('') }}. All obs-* units and timers were stopped and disabled.
