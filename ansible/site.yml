# lemdroid-ovh: the single backend server for lemdro.id (OVH SYS-2, Debian 13).
# Captures the box as it runs since 2026-11-19. Data (Postgres contents, pict-rs media in B2) is NOT managed here:
# it is restored from backups, see README.md "Restore order" and ../docs/rebuild.md.
#
# Check against the live box (changes nothing). vault.yml is committed AES256 ciphertext.
# The password is not in git (Google Drive). --ask-vault-pass works instead of a password file.
# Never commit the password.
#   ansible-playbook site.yml -e @vault.yml --vault-password-file <path> \
#     -e lemdroid_start_services=true --check --diff
- name: Configure lemdroid-ovh
  hosts: lemdroid
  become: true
  pre_tasks:
    - name: Only Debian 13 (trixie) is supported
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
        quiet: true
  roles:
    - base
    - firewall
    - tailscale
    - role: postgres
      tags: [postgres]
    - docker
    - photon
    - role: pictrs
      tags: [pictrs]
    - lemmy
    - role: frontends
      tags: [frontends]
    - role: cloudflared
      tags: [cloudflared]
    - role: androidnews
      tags: [androidnews]
    - role: lemdroid_patches
      tags: [lemdroid_patches]
