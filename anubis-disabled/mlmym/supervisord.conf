[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:mlmym]
command=/app/mlmym --addr 127.0.0.1:8081
directory=/app
user=mlmym
priority=1
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:anubis]
command=/usr/local/bin/anubis
user=mlmym
priority=2
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
# ED25519_PRIVATE_KEY_HEX is inherited from the container environment
# (a Fly secret). Do not put a key here.
environment=BIND="127.0.0.1:8923",BIND_NETWORK="tcp",TARGET="http://127.0.0.1:8081",POLICY_FNAME="/etc/anubis/botPolicies.yaml",DIFFICULTY="4",COOKIE_SECURE="true",COOKIE_SAME_SITE="Lax",COOKIE_EXPIRATION_TIME="168h",METRICS_BIND="127.0.0.1:9090",METRICS_BIND_NETWORK="tcp",PUBLIC_URL="https://old.lemdro.id",REDIRECT_DOMAINS="old.lemdro.id",CUSTOM_REAL_IP_HEADER="X-Real-IP",SLOG_LEVEL="INFO"

[program:nginx]
command=/usr/local/bin/start-nginx.sh
priority=3
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mlmym-peers]
command=/usr/local/bin/mlmym-peers-loop.sh
priority=4
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
