# lemdroid-ovh edge nginx.
# Reached only by cloudflared on 127.0.0.1 (no public listener).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Setup nodeinfo caching
    proxy_cache_path /var/cache/nginx/nodeinfo levels=1:2 keys_zone=nodeinfo_cache:10m max_size=10m inactive=1h use_temp_path=off;

    log_format main_host '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                         '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    log_format inbox '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main_host;

    map $remote_addr $bypass_cache {
        default 0;
        ~^127\. 1;
    }

    # Only cloudflared (localhost) can reach this nginx, so CF-Connecting-IP is trustworthy.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    upstream lemmy {
        server "127.0.0.1:8080";
    }
    upstream lemmy-ui {
        server 127.0.0.1:1234;
    }
    upstream photon-ui {
        server 127.0.0.1:8089;
    }
    upstream mlmym {
        server 127.0.0.1:8081;
    }

    map "$request_method:$http_accept" $proxpass {
        default photon-ui;
        "~^(?:GET|HEAD):.*?application\/(?:activity|ld)\+json" "lemmy";
        "~^(?!(GET|HEAD)).*:" "lemmy";
    }

    # Unknown hosts
    server {
        listen 127.0.0.1:8088 default_server;
        server_tokens off;
        location /nginx_alive_check { return 200; }
        location / { return 404; }
    }

    # ---- lemdro.id (apex), reached through the tunnel ----
    server {
        listen 127.0.0.1:8088;
        server_name lemdro.id;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;

        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location /img/logo-background.svg {
            return 301 https://lemdro.id/pictrs/image/609c5787-6b5c-40e1-aba6-5123df2ea35e.png;
        }

        location / {
            proxy_pass http://$proxpass;
            proxy_buffer_size   128k;
            proxy_buffers   4 256k;
            proxy_busy_buffers_size   256k;
            rewrite ^(.+)/+$ $1 permanent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /inbox {
            access_log /var/log/nginx/access.log inbox;
            proxy_pass "http://lemmy";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(u|c)/[^/]+/inbox$ {
            access_log /var/log/nginx/access.log inbox;
            proxy_pass "http://lemmy";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(api|pictrs|feeds|nodeinfo|.well-known) {
            proxy_pass "http://lemmy";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx_alive_check {
            return 200;
        }

        location = /nodeinfo/2.0.json {
            proxy_cache nodeinfo_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_bypass $bypass_cache;
            proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_pass "http://lemmy";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ---- Photon static build for the apex (internal only) ----
    server {
        listen 127.0.0.1:8089;
        server_tokens off;
        root /srv/photon;
        location /_app/immutable/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /_app/env.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location = /_app/version.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location / {
            try_files $uri /index.html;
        }
        location = /index.html { add_header Cache-Control "no-cache"; }
    }

    # ---- l.lemdro.id (lemmy-ui SSR) ----
    server {
        listen 127.0.0.1:8088;
        server_name l.lemdro.id;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;

        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location / {
            proxy_pass "http://lemmy-ui";
            rewrite ^(.+)/+$ $1 permanent;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass "http://lemmy";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx_alive_check {
            return 200;
        }
    }

    # ---- old.lemdro.id (mlmym) ----
    server {
        listen 127.0.0.1:8088;
        server_name old.lemdro.id;
        server_tokens off;

        client_max_body_size 20M;

        location / {
            proxy_pass "http://mlmym";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /nginx_alive_check {
            return 200;
        }
    }
}
