# fly.toml app configuration file generated for federation-buffer on 2024-04-17T00:08:20-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Reproduces live state as of 2026-11-04 (snapshot of the Fly Machines API).
# Live: 1 machine, sjc, shared-cpu-1x / 1 GB, always on, restart on-failure (max 10).
# Deployed image: registry.fly.io/federation-buffer:deployment-01KBDWR52BDZF2JRX8KQ721A2V
#   digest sha256:2fc6cfa68801518c6f0957e193bc328af977ac2e319d68eb3200a419c1811086
#   Built 2025-12-01 from the buffer.go in this directory.
# IPs: IPv6 + private flycast. primary_region stays "sea" because that is what the live machine carries.

app = 'federation-buffer'
primary_region = 'sea'

[build]
  [build.args]
    GO_VERSION = '1.22.2'

[env]
  PORT = '8080'
  # Lemmy backend on the VPS (private WireGuard peer in the Fly 6PN network);
  # previously the now-suspended lemdroid-lemmy.flycast
  FORWARD_HOST = '[fdaa:2:735c:a7b:910f:0:a:202]:8080'

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "2s"
    interval = "2s"
    timeout = "1s"
    method = "GET"
    path = "/proxy_health"
    protocol = "http"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
