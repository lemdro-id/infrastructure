# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Reproduces live state as of 2026-11-04 (snapshot of the Fly Machines API).
# Live: 1 machine, sjc, shared-cpu-4x / 1 GB + 2 GB swap, restart on-failure (max 10).
# Image digest: sha256:b2f67facdc856ac69d2dd02a6fd42ae95485d7180ad4cbcc9ca348b5e5b8ee24 (built 2023-12-09)
# Private only (flycast, no public IPs). Media in Backblaze B2; /mnt volume holds the sled metadata repo.
# Secrets (names only): PICTRS__SERVER__API_KEY, PICTRS__STORE__ACCESS_KEY, PICTRS__STORE__SECRET_KEY
# RETIRED: replaced by pict-rs 0.5 on the backend VPS (pictrs/docker-compose.yml). Kept for history/rollback.

app = "lemdroid-pictrs"
primary_region = "sjc"
swap_size_mb = 2048

[build]
  image = "asonix/pictrs:0.4.6"

[env]
  PICTRS__MEDIA__GIF__MAX_AREA = "65536"
  PICTRS__MEDIA__GIF__MAX_FRAME_COUNT = "400"
  PICTRS__MEDIA__GIF__MAX_HEIGHT = "256"
  PICTRS__MEDIA__GIF__MAX_WIDTH = "256"
  PICTRS__MEDIA__VIDEO_CODEC = "vp9"
  PICTRS__SERVER__ADDRESS = "0.0.0.0:8080"
  PICTRS__STORE__BUCKET_NAME = "lemdroid"
  PICTRS__STORE__ENDPOINT = "https://s3.us-west-004.backblazeb2.com"
  PICTRS__STORE__REGION = "us-west-004"
  PICTRS__STORE__TYPE = "object_storage"
  PICTRS__STORE__USE_PATH_STYLE = "false"
  RUST_BACKTRACE = "full"

[[mounts]]
  source = "pictrs_data"
  destination = "/mnt"

[http_service]
  internal_port = 8080
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  
  [http_service.concurrency]
    type = "requests"
    soft_limit = 896
    hard_limit = 1024

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    restart_limit = 0
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory = "1gb"
