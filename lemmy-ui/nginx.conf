worker_processes auto;

events {

    worker_connections 1024;
}

http {
    # Get real ip from Cloudflare headers, needed for rate-limiting and Anubis.
    # Anubis must see the visitor IP (not a Cloudflare or Fly hop). It flattens
    # X-Forwarded-For from the right and skips private addresses, so we pass
    # only $remote_addr (already rewritten from CF-Connecting-IP) rather than
    # the incoming XFF chain. See https://anubis.techaro.lol/docs/admin/caveats-xff
    set_real_ip_from 172.16.0.0/16;
    set_real_ip_from 172.19.0.0/16;
    real_ip_header CF-Connecting-IP;

    upstream lemmy {
        # this needs to map to the lemmy (server) docker service hostname
        server "[fdaa:2:735c:a7b:910f:0:a:202]:8080";
    }

    upstream anubis {
        server 127.0.0.1:8923;
    }

    # Sticky routing per visitor (fly-replay). Anubis v1.28.2 keeps pending
    # challenges in each machine's memory, so a challenge issued on one machine
    # fails ("key not found") if the solve lands on the other. Each machine
    # tags visitors with lui_machine=<its FLY_MACHINE_ID>; a request carrying
    # another machine's ID is handed back to Fly with
    # `fly-replay: prefer_instance=<id>`. prefer_instance lets Fly use another
    # machine if the target can't take the request, and a request that was
    # already replayed is never replayed again, so it always gets served.
    # Fly answers a replay to an unknown machine with HTTP 400, so only IDs in
    # $lui_known (this app's machines, from Fly internal DNS) are replayed; a
    # stale cookie is served here and re-tagged.
    # $lui_self comes from /etc/nginx/lui-self.conf (start-nginx.sh) and
    # $lui_known from /etc/nginx/lui-peers.conf (lui-peers.js, refreshed by
    # lui-peers.sh).
    include /etc/nginx/lui-self.conf;
    include /etc/nginx/lui-peers.conf;

    map $cookie_lui_machine $lui_cookie {
        "~^[0-9a-f]{1,32}$" $cookie_lui_machine;
        default "";
    }

    # self|cookie|replay-markers -> machine to replay to ("" = serve here)
    map "$lui_self|$lui_known|$http_fly_replay_src$http_fly_preferred_instance_unavailable" $lui_replay_to {
        "~^[^|]*\|[^|]*\|."                     "";   # already replayed: never loop
        "~^\|"                                   "";   # no own ID: feature off
        "~^[^|]+\|\|"                            "";   # no cookie, or not a live machine
        "~^(?<lui_a>[0-9a-f]+)\|\k<lui_a>\|$"    "";   # cookie is us
        "~^[0-9a-f]+\|(?<lui_b>[0-9a-f]+)\|$"    $lui_b;
        default                                  "";
    }

    # Set-Cookie unless the visitor already carries our ID.
    map "$lui_self|$lui_cookie" $lui_set_cookie {
        "~^\|"                                   "";
        "~^(?<lui_c>[0-9a-f]+)\|\k<lui_c>$"       "";
        "~^(?<lui_d>[0-9a-f]+)\|"                 "lui_machine=$lui_d; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax";
        default                                  "";
    }

    server {

        listen 8080;
        server_name l.lemdro.id lemdro.id;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;

        # Upload limit, relevant for pictrs
        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Set-Cookie $lui_set_cookie;

        location / {
           # nginx → Anubis :8923 → Node :1234
           proxy_pass http://anubis;

           # Send the visitor back to the machine that holds their challenge.
           if ($lui_replay_to) {
               add_header fly-replay "prefer_instance=$lui_replay_to" always;
               return 204;
           }

           rewrite ^(.+)/+$ $1 permanent;
           # Send actual client IP upstream (see real_ip comments above).
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $remote_addr;
           # Cloudflare terminates TLS; Fly talks HTTP to this port.
           proxy_set_header X-Forwarded-Proto https;
           proxy_set_header Host $host;
        }

        # route relative to l.lemdro.id/api/*
        # Bypasses Anubis: the SPA talks to the apex API anyway, but some
        # clients still call /api on this host. Federation does not use this
        # hostname.
        location /api/ {
            proxy_pass "http://lemmy";
            # proxy common stuff
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Send actual client IP upstream
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # RSS readers cannot solve Anubis's proof-of-work. The apex already
        # serves /feeds/ from the Lemmy backend (proxy location on lemdro.id).
        location /feeds/ {
            return 301 https://lemdro.id$request_uri;
        }

        # nginx up check (no upstream). Fly http_service check.
        location /nginx_alive_check {
            return 200;
        }

        # Node SSR liveness, used by the Fly /login replacement check.
        # Bypasses Anubis because a challenge is HTTP 200 and would look healthy
        # even when Node is down. Require the header Fly sends in fly.toml.
        location = /node_alive_check {
            if ($http_x_lemmy_ui_healthcheck != "1") {
                return 404;
            }
            proxy_pass http://127.0.0.1:1234/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
}
