worker_processes auto;

events {

    worker_connections 1024;
}

http {
    # Get real ip from Cloudflare headers, needed for rate-limiting and Anubis.
    # Anubis must see the visitor IP (not a Cloudflare or Fly hop). It flattens
    # X-Forwarded-For from the right and skips private addresses, so we pass
    # only $remote_addr (already rewritten from CF-Connecting-IP) rather than
    # the incoming XFF chain. See https://anubis.techaro.lol/docs/admin/caveats-xff
    set_real_ip_from 172.16.0.0/16;
    set_real_ip_from 172.19.0.0/16;
    real_ip_header CF-Connecting-IP;

    upstream lemmy {
        # this needs to map to the lemmy (server) docker service hostname
        server "[fdaa:2:735c:a7b:910f:0:a:202]:8080";
    }

    upstream anubis {
        server 127.0.0.1:8923;
    }

    server {

        listen 8080;
        server_name l.lemdro.id lemdro.id;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;

        # Upload limit, relevant for pictrs
        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location / {
           # nginx → Anubis :8923 → Node :1234
           proxy_pass http://anubis;

           rewrite ^(.+)/+$ $1 permanent;
           # Send actual client IP upstream (see real_ip comments above).
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $remote_addr;
           # Cloudflare terminates TLS; Fly talks HTTP to this port.
           proxy_set_header X-Forwarded-Proto https;
           proxy_set_header Host $host;
        }

        # route relative to l.lemdro.id/api/*
        # Bypasses Anubis: the SPA talks to the apex API anyway, but some
        # clients still call /api on this host. Federation does not use this
        # hostname.
        location /api/ {
            proxy_pass "http://lemmy";
            # proxy common stuff
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Send actual client IP upstream
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # RSS readers cannot solve Anubis's proof-of-work. The apex already
        # serves /feeds/ from the Lemmy backend (proxy location on lemdro.id).
        location /feeds/ {
            return 301 https://lemdro.id$request_uri;
        }

        # nginx up check (no upstream). Fly http_service check.
        location /nginx_alive_check {
            return 200;
        }

        # Node SSR liveness, used by the Fly /login replacement check.
        # Bypasses Anubis because a challenge is HTTP 200 and would look healthy
        # even when Node is down. Require the header Fly sends in fly.toml.
        location = /node_alive_check {
            if ($http_x_lemmy_ui_healthcheck != "1") {
                return 404;
            }
            proxy_pass http://127.0.0.1:1234/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
}
