[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:lemmy-ui]
command=/usr/local/bin/node dist/js/server.js
user=node
priority=1
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:anubis]
command=/usr/local/bin/anubis
user=node
priority=2
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
# ED25519_PRIVATE_KEY_HEX is inherited from the container environment
# (a Fly secret). Do not put a key here.
environment=BIND="127.0.0.1:8923",BIND_NETWORK="tcp",TARGET="http://127.0.0.1:1234",POLICY_FNAME="/etc/anubis/botPolicies.yaml",DIFFICULTY="4",COOKIE_SECURE="true",COOKIE_SAME_SITE="Lax",COOKIE_EXPIRATION_TIME="168h",METRICS_BIND="127.0.0.1:9090",METRICS_BIND_NETWORK="tcp",PUBLIC_URL="https://l.lemdro.id",REDIRECT_DOMAINS="l.lemdro.id",CUSTOM_REAL_IP_HEADER="X-Real-IP",SLOG_LEVEL="INFO"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=3
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
