# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# 2 machines, sjc, shared-cpu-1x / 512 MB, restart on-failure.
# Hostname: old.lemdro.id (Fly cert). m.lemdro.id is Voyager, not this app.
#
# Plain mlmym, no Anubis (2026-11-13). Bots are now stopped at the Cloudflare
# edge by a WAF custom rule (Managed Challenge) on old.lemdro.id and l.lemdro.id,
# so the in-app Anubis layer was removed to cut per-request work and egress.
#   CF zone lemdro.id, ruleset cccad4590f3a43928dc978d038331ce9,
#   rule a5bc50282eca4b08a1229a255214c201 (managed_challenge, all host:port variants).
# Kept from the Anubis rollout: 512 MB, concurrency 25/50, min_machines_running 1
# (256 MB / 800-1000 OOM'd under crawler SSR on 2026-11-13).
#
# Re-enable Anubis (one command, the ED25519_PRIVATE_KEY_HEX secret is still set):
#   cd anubis-disabled/mlmym && fly deploy -a lemdroid-mlmym \
#     --image registry.fly.io/lemdroid-mlmym:deployment-01M7AXV9P0GSEMK1ZJTFNYYZVF
#   (or rebuild from that directory without --image)

app = "lemdroid-mlmym"
primary_region = "sjc"

[build]
  image = "ghcr.io/rystaf/mlmym@sha256:aa6c284e739de6eb2d341aa0a6b59479b4dde61f3c85ac5fb1fc419d4f231b2e"

[deploy]
  strategy = "canary"

[env]
  LEMMY_DOMAIN = "lemdro.id"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  # Cheap static asset instead of / : SSR of / timed out under the crawl and
  # restarted machines. Still proves the mlmym process is serving.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    restart_limit = 0
    method = "GET"
    path = "/_/static/style.css"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
