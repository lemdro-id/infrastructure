worker_processes auto;

events {

    worker_connections 1024;
}

http {
    # Get real ip from Cloudflare headers, needed for Anubis.
    # Anubis must see the visitor IP (not a Cloudflare or Fly hop). It flattens
    # X-Forwarded-For from the right and skips private addresses, so we pass
    # only $remote_addr (already rewritten from CF-Connecting-IP) rather than
    # the incoming XFF chain. See https://anubis.techaro.lol/docs/admin/caveats-xff
    set_real_ip_from 172.16.0.0/16;
    set_real_ip_from 172.19.0.0/16;
    real_ip_header CF-Connecting-IP;

    upstream mlmym {
        server 127.0.0.1:8081;
    }

    upstream anubis {
        server 127.0.0.1:8923;
    }

    # Sticky routing per visitor (fly-replay). Anubis v1.28.2 keeps pending
    # challenges in each machine's memory, so a challenge issued on one machine
    # fails ("key not found") if the solve lands on the other. Each machine
    # tags visitors with mlmym_machine=<its FLY_MACHINE_ID>; a request carrying
    # another machine's ID is handed back to Fly with
    # `fly-replay: prefer_instance=<id>`. prefer_instance lets Fly use another
    # machine if the target can't take the request, and a request that was
    # already replayed is never replayed again, so it always gets served.
    # Fly answers a replay to an unknown machine with HTTP 400, so only IDs in
    # $mlmym_known (this app's machines, from Fly internal DNS) are replayed; a
    # stale cookie is served here and re-tagged.
    # $mlmym_self comes from /etc/nginx/mlmym-self.conf (start-nginx.sh) and
    # $mlmym_known from /etc/nginx/mlmym-peers.conf (mlmym-peers.sh).
    include /etc/nginx/mlmym-self.conf;
    include /etc/nginx/mlmym-peers.conf;

    map $cookie_mlmym_machine $mlmym_cookie {
        "~^[0-9a-f]{1,32}$" $cookie_mlmym_machine;
        default "";
    }

    # self|cookie|replay-markers -> machine to replay to ("" = serve here)
    map "$mlmym_self|$mlmym_known|$http_fly_replay_src$http_fly_preferred_instance_unavailable" $mlmym_replay_to {
        "~^[^|]*\|[^|]*\|."                        "";   # already replayed: never loop
        "~^\|"                                      "";   # no own ID: feature off
        "~^[^|]+\|\|"                              "";   # no cookie, or not a live machine
        "~^(?<mlmym_a>[0-9a-f]+)\|\k<mlmym_a>\|$" "";   # cookie is us
        "~^[0-9a-f]+\|(?<mlmym_b>[0-9a-f]+)\|$"    $mlmym_b;
        default                                     "";
    }

    # Set-Cookie unless the visitor already carries our ID.
    map "$mlmym_self|$mlmym_cookie" $mlmym_set_cookie {
        "~^\|"                                      "";
        "~^(?<mlmym_c>[0-9a-f]+)\|\k<mlmym_c>$"    "";
        "~^(?<mlmym_d>[0-9a-f]+)\|"                 "mlmym_machine=$mlmym_d; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax";
        default                                     "";
    }

    server {

        listen 8080;
        server_name old.lemdro.id;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;

        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Set-Cookie $mlmym_set_cookie;

        location / {
           # nginx → Anubis :8923 → mlmym :8081
           proxy_pass http://anubis;

           # Send the visitor back to the machine that holds their challenge.
           if ($mlmym_replay_to) {
               add_header fly-replay "prefer_instance=$mlmym_replay_to" always;
               return 204;
           }

           rewrite ^(.+)/+$ $1 permanent;
           # Send actual client IP upstream (see real_ip comments above).
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $remote_addr;
           # Cloudflare terminates TLS; Fly talks HTTP to this port.
           proxy_set_header X-Forwarded-Proto https;
           proxy_set_header Host $host;
        }

        # mlmym static assets (public/ served at /_/static/ in single-instance
        # mode). Cheap, no SSR; do not challenge.
        location /_/static/ {
            proxy_pass http://mlmym;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Site icon; GetIcon may hit the API once, still cheap vs post SSR.
        location = /icon.jpg {
            proxy_pass http://mlmym;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # mlmym does not serve a Lemmy API. Belt-and-suspenders: if something
        # does hit /api/ on this host, do not challenge it. Pass through to
        # mlmym (today this 404s); do not open a new proxy to the VPS backend.
        location /api/ {
            proxy_pass http://mlmym;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # nginx up check (no upstream). Fly http_service check.
        location /nginx_alive_check {
            return 200;
        }

        # mlmym liveness, used by the Fly health check. Bypasses Anubis because
        # a challenge is HTTP 200 and would look healthy even when mlmym is
        # down. Require the header Fly sends in fly.toml. Hits a static file
        # so the check does not SSR the frontpage (which was timing out under
        # the crawl).
        location = /mlmym_alive_check {
            if ($http_x_mlmym_healthcheck != "1") {
                return 404;
            }
            proxy_pass http://127.0.0.1:8081/_/static/photo.png;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
}
