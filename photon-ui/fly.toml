# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Reproduces live state as of 2026-11-04 (snapshot of the Fly Machines API).
# Live: 4 machines: iad, fra, sjc x2 (one sjc standby), shared-cpu-1x / 512 MB.
#   fly scale count 1 --region iad; fly scale count 1 --region fra; fly scale count 2 --region sjc
# Image V2.1.1 digest sha256:c5a140bfa31800b879a8309789ca2cf260d02e947304407371437b1d6db0376e
# Hostnames: p.lemdro.id, nu.lemdro.id, photon.lemdro.id. IPs: IPv6 + private flycast.
# primary_region stays "sea" because that is what the live machines carry (PRIMARY_REGION), though none run there.

app = "lemdroid-photon-ui"
primary_region = "sea"

[deploy]
  strategy = "bluegreen"

[build]
  image = "ghcr.io/xyphyn/photon:V2.1.1"

[env]
  PUBLIC_INSTANCE_URL = "lemdro.id"
  PUBLIC_RANDOM_PLACEHOLDERS = false
  PUBLIC_SSR_ENABLED = false
  PUBLIC_MIGRATE_COOKIE = true
  PUBLIC_DOCK_PANEL = true
  PUBLIC_DOCK_TOP = true
  
[http_service]
  internal_port = 3000
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

 [http_service.concurrency]
    type = "requests"
    #hard_limit = 512
    #soft_limit = 384
    hard_limit = 384
    soft_limit = 192
    
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "1s"
    method = "GET"
    path = "/login"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
