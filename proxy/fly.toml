# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Reproduces live state as of 2026-11-04 (snapshot of the Fly Machines API).
# Live: 4 machines: iad, fra, sjc x2 (one sjc standby), shared-cpu-1x / 256 MB, restart on-failure (max 10).
#   fly scale count 1 --region iad; fly scale count 1 --region fra; fly scale count 2 --region sjc
# Deployed image: registry.fly.io/lemdroid-lemmy-proxy:deployment-01KMXBMQ9220TYWETBHREA4X7V
#   digest sha256:00db18448fe6cb598aa565dab689b11deabda19e8818d9c1922d4936c85faacd
#   NOTE: deployed image is newer than the Dockerfile/nginx.conf in this directory (source to be pushed).
# Hostname: lemdro.id. IPs: dedicated IPv4 + IPv6.

app = "lemdroid-lemmy-proxy"
primary_region = "sjc"

[deploy]
  strategy = "canary"

[http_service]
  internal_port = 80
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1024
    soft_limit = 950

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "1s"
    method = "GET"
    path = "/nginx_alive_check"
    protocol = "http"

[checks]
  [checks.backend_api]
    port = 80
    type = "http"
    interval = "1m0s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/api/v3/site"
  [checks.backend_nodeinfo]
    port = 80
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/nodeinfo/2.0.json"
  [checks.frontend]
    port = 80
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/login"
  [checks.tcp]
    port = 80
    type = "tcp"
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
