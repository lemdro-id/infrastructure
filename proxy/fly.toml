# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Reproduces live state as of 2026-11-14 after the /inbox direct-to-Lemmy trial (v108).
# Live: 4 machines: iad, fra, sjc x2 (one sjc standby), shared-cpu-1x / 256 MB, restart on-failure (max 10).
#   fly scale count 1 --region iad; fly scale count 1 --region fra; fly scale count 2 --region sjc
# Deployed image: registry.fly.io/lemdroid-lemmy-proxy:deployment-01M7DN6JC4RVFMXCRGS0900CZ8
#   digest sha256:9125bc8b46aef572070ed2d9fc19e49c3b4f624905700085fb4e3e5f15a11a9f
#   Built 2026-11-14 from the Dockerfile/nginx.conf in this directory (nginx 1.30.6,
#   /inbox and /u|/c/*/inbox proxy_pass to the Lemmy upstream, 15s read timeout).
#   Rollback image: registry.fly.io/lemdroid-lemmy-proxy:deployment-01M7DKACXQK95JPPSCK3ME9E6N
#   (v107). federation-buffer is still running and is not on the request path.
# Hostname: lemdro.id. IPs: dedicated IPv4 + IPv6.

app = "lemdroid-lemmy-proxy"
primary_region = "sjc"

[deploy]
  strategy = "canary"

[http_service]
  internal_port = 80
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1024
    soft_limit = 950

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "1s"
    method = "GET"
    path = "/nginx_alive_check"
    protocol = "http"

[checks]
  [checks.backend_api]
    port = 80
    type = "http"
    interval = "1m0s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/api/v3/site"
  [checks.backend_nodeinfo]
    port = 80
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/nodeinfo/2.1"
  [checks.frontend]
    port = 80
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/login"
  [checks.tcp]
    port = 80
    type = "tcp"
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
